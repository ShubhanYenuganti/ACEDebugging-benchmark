AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Serverless API on RDS PostgreSQL. Models API Gateway -> VPC Lambda ->
  RDS Postgres with credentials stored in Secrets Manager encrypted by a
  KMS CMK. Arch02 corpus for ACE-Bench.

Resources:

  # ── Networking ────────────────────────────────────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-east-1a

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: us-east-1b

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for OrdersDb
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  # CORRECT: allows TCP 5432 from within the VPC (fault01 removes/narrows this)
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS access for Lambda
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16

  # ── KMS CMK ───────────────────────────────────────────────────────────────
  # CORRECT: grants ApiHandlerRole kms:Decrypt (fault02 removes the role grant from the IAM policy)
  # Key policy grants root full admin; IAM policies on the role control per-principal access.
  DbKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for RDS and Secrets Manager encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountRoot
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  DbKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-db-key'
      TargetKeyId: !Ref DbKmsKey

  # ── Secrets Manager ───────────────────────────────────────────────────────
  # CORRECT: encrypted by DbKmsKey, real username/password (fault03 corrupts ARN reference)
  # Fixed credentials so RDS MasterUsername/Password can reference the same values.
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-db-secret'
      Description: RDS master credentials for OrdersDb
      KmsKeyId: !Ref DbKmsKey
      SecretString: '{"username":"dbadmin","password":"DbP@ssw0rd2024!"}'

  # ── RDS ───────────────────────────────────────────────────────────────────
  # CORRECT: max_connections=100 (fault04 lowers it)
  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Parameter group for arch03 OrdersDb
      Family: postgres15
      Parameters:
        max_connections: '100'

  # CORRECT: endpoint host/port come from GetAtt (fault01 corrupts DB_PORT via wrong value)
  OrdersDb:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-orders-db'
      Engine: postgres
      EngineVersion: '15'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageEncrypted: true
      KmsKeyId: !Ref DbKmsKey
      MasterUsername: dbadmin
      MasterUserPassword: 'DbP@ssw0rd2024!'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      DBParameterGroupName: !Ref DbParameterGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
    DeletionPolicy: Delete

  # ── IAM Role ──────────────────────────────────────────────────────────────
  ApiHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-api-handler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: api-handler-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              # CORRECT: GetSecretValue on DbSecret (fault03 will corrupt DB_SECRET_ARN; fault02 removes this permission)
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DbSecret
              # CORRECT: kms:Decrypt on DbKmsKey so Secrets Manager can decrypt the secret
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !GetAtt DbKmsKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  # ── Lambda Function ───────────────────────────────────────────────────────
  # CORRECT: Timeout=30 (fault04 changes Timeout to 1)
  ApiHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api-handler'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt ApiHandlerRole.Arn
      Timeout: 30
      TracingConfig:
        Mode: Active
      VpcConfig:
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
        SecurityGroupIds:
          - !Ref DbSecurityGroup
      Environment:
        Variables:
          # CORRECT: dynamic endpoint from RDS (fault01 injects a wrong port)
          DB_HOST: !GetAtt OrdersDb.Endpoint.Address
          DB_PORT: !GetAtt OrdersDb.Endpoint.Port
          DB_NAME: postgres
          # CORRECT: points to the real secret (fault03 points to a nonexistent ARN)
          DB_SECRET_ARN: !Ref DbSecret
          AWS_ENDPOINT_URL: http://localhost.localstack.cloud:4566
      Code:
        S3Bucket: ace-bench-artifacts
        S3Key: api-handler.zip

  # ── API Gateway ───────────────────────────────────────────────────────────
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-orders-api'
      EndpointConfiguration:
        Types:
          - REGIONAL

  # /orders resource
  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: orders

  # /orders/{id} resource
  OrderIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !Ref OrdersResource
      PathPart: '{id}'

  # POST /orders
  PostOrdersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn: !GetAtt ApiHandlerFunction.Arn

  # GET /orders/{id}
  GetOrderMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref OrderIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn: !GetAtt ApiHandlerFunction.Arn

  # Lambda invoke permission for API Gateway
  ApiHandlerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiHandlerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PostOrdersMethod
      - GetOrderMethod
    Properties:
      RestApiId: !Ref Api

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: prod

Outputs:
  ApiBaseUrl:
    Value: !Sub 'http://${Api}.execute-api.localhost.localstack.cloud:4566/prod'
  DbInstanceId:
    Value: !Ref OrdersDb
  DbParameterGroupName:
    Value: !Ref DbParameterGroup
  DbSecretArn:
    Value: !Ref DbSecret
  DbSecurityGroupId:
    Value: !Ref DbSecurityGroup
  KmsKeyId:
    Value: !Ref DbKmsKey
